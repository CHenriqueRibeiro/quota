[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quota-sdk"
version = "1.0.0"
description = "SDK oficial em Python para telemetria, latência e monitoramento de consumo de LLMs no Quota"
readme = "README.md"
authors = [{ name = "Quota Team" }]
license = { text = "MIT" }
dependencies = [
    "httpx>=0.23.0",
    "requests>=2.28.0",
]
requires-python = ">=3.8"
keywords = ["quota", "llm", "telemetry", "openai", "anthropic", "gemini", "ai", "tokens"]

[tool.pyright]
venvPath = "."
venv = ".venv"

